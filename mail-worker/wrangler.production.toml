name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail-db"
database_id = "37af850a-d300-4a8a-a71a-4864a7e5cdf6"

[[kv_namespaces]]
binding = "kv"
id = "00b08442a72046d686fefa1ab33d4708"

[[r2_buckets]]
binding = "r2"
bucket_name = "cloud-mail-r2"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]
orm_log = false
domain = ["edmf.nl"]
admin = "admin"
ai_model = "@cf/meta/llama-3.1-8b-instruct-fast"
analysis_cache = false

[build]
command = "npx --yes pnpm@11 --prefix ../mail-vue install --frozen-lockfile && npx --yes pnpm@11 --prefix ../mail-vue run build"
